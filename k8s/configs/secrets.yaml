# Secret con credenciales sensibles
# IMPORTANTE: Este archivo debe codificarse en base64 o usar kubectl create secret
# Los valores aquí son ejemplos y DEBEN cambiarse en producción
apiVersion: v1
kind: Secret
metadata:
  name: agro-secrets
  namespace: default
type: Opaque
stringData:
  # PostgreSQL credentials
  POSTGRES_USER: "agro_user"
  POSTGRES_PASSWORD: "agro_password"
  
  # MongoDB credentials
  MONGO_USER: "agro_user"
  MONGO_PASSWORD: "agro_password"
  
  # MongoDB URI completa
  MONGODB_URI: "mongodb://agro_user:agro_password@mongo:27017/agro_sensors?authSource=admin"
  
  # JWT Secret
  JWT_SECRET: "your_super_secret_jwt_key_here_please_change_in_production"

---
# NOTA: Para crear este secret de forma segura en producción, usa:
# kubectl create secret generic agro-secrets \
#   --from-literal=POSTGRES_USER=agro_user \
#   --from-literal=POSTGRES_PASSWORD=your_secure_password \
#   --from-literal=MONGO_USER=admin \
#   --from-literal=MONGO_PASSWORD=your_mongo_password \
#   --from-literal=MONGODB_URI=mongodb://admin:password@mongo:27017/agro_mongo_db?authSource=admin \
#   --from-literal=JWT_SECRET=your_jwt_secret
