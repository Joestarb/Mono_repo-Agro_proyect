# Deployment del Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: default
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: agro-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: agro-secrets
              key: MONGODB_URI
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: agro-config
              key: DB_NAME
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: agro-config
              key: AUTH_SERVICE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: agro-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRATION
          valueFrom:
            configMapKeyRef:
              name: agro-config
              key: JWT_EXPIRATION
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: agro-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: agro-config
              key: GATEWAY_PORT
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: agro-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: agro-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: agro-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: agro-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agro-secrets
              key: POSTGRES_PASSWORD
        - name: API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: agro-config
              key: API_BASE_URL
        - name: POLL_INTERVAL_MS
          valueFrom:
            configMapKeyRef:
              name: agro-config
              key: POLL_INTERVAL_MS
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      restartPolicy: Always
---
# Service del Gateway
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: default
  labels:
    app: gateway
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30001
    protocol: TCP
    name: http
  selector:
    app: gateway
