services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15
    container_name: agro_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agro_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de datos MongoDB
  mongo:
    image: mongo:6
    container_name: agro_mongo
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_EXTERNAL_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - agro_network
    healthcheck:
      test: ["CMD", "mongosh", "--username", "${MONGO_USER}", "--password", "${MONGO_PASSWORD}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de ingestión de datos
  ingestion-service:
    build:
      context: .
      dockerfile: ./apps/agro-repo-ingestion/Dockerfile
    container_name: agro_ingestion
    environment:
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      API_BASE_URL: ${API_BASE_URL}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - agro_network
    volumes:
      - ./apps/agro-repo-ingestion/src:/app/apps/agro-repo-ingestion/src
    restart: unless-stopped

  # Servicio de gateway
  gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/dockerfile
    container_name: agro_gateway
    ports:
      - "${GATEWAY_EXTERNAL_PORT}:3000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      DB_NAME: ${DB_NAME}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      NODE_ENV: ${NODE_ENV}
      PORT: ${GATEWAY_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_BASE_URL: ${API_BASE_URL}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS}
    depends_on:
      - auth-service
      - ingestion-service
    networks:
      - agro_network
    volumes:
      - ./apps/gateway/src:/app/apps/gateway/src
    restart: unless-stopped

  # Servicio de autenticación
  auth-service:
    build:
      context: .
      dockerfile: ./apps/auth-service/dockerfile
    container_name: agro_auth_service
    ports:
      - "${AUTH_SERVICE_EXTERNAL_PORT}:3000"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      NODE_ENV: ${NODE_ENV}
      PORT: ${AUTH_SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agro_network
    volumes:
      - ./apps/auth-service/src:/app/apps/auth-service/src
    restart: unless-stopped

  # Frontend
  agro-repo-frontend:
    build:
      context: .
      dockerfile: ./apps/agro-repo-frontend/dockerfile
    container_name: agro_frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-5173}:5173"
    environment:
      VITE_GATEWAY_URL: ${GATEWAY_URL:-http://localhost:3001}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - gateway
    networks:
      - agro_network
    volumes:
      - ./apps/agro-repo-frontend/src:/app/apps/agro-repo-frontend/src
      - ./apps/agro-repo-frontend/public:/app/apps/agro-repo-frontend/public
      - ./apps/agro-repo-frontend/index.html:/app/apps/agro-repo-frontend/index.html
      - ./apps/agro-repo-frontend/vite.config.ts:/app/apps/agro-repo-frontend/vite.config.ts
    restart: unless-stopped

  # Servicio de parcelas
  agro-repo-plots:
    build:
      context: .
      dockerfile: ./apps/agro-repo-plots/Dockerfile
    container_name: agro_plots_service
    ports:
      - "3002:3000"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agro_network
    volumes:
      - ./apps/agro-repo-plots/src:/app/apps/agro-repo-plots/src
    restart: unless-stopped

# Volúmenes
volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local

# Redes
networks:
  agro_network:
    driver: bridge
